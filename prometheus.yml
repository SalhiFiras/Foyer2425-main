# prometheus.yml
global:
  scrape_interval: 15s # How frequently to scrape targets
  evaluation_interval: 15s # How frequently to evaluate rules

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Prometheus scrapes itself

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus' # Assuming your Spring Boot app exposes Prometheus metrics at /actuator/prometheus
    static_configs:
      # Use the service name and internal port within the Docker network
      - targets: ['my-spring-boot-app:8080']