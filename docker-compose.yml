version: '3.8'

networks:
  monitoring_network: # This network is crucial for all services to communicate
    driver: bridge

services:
  # SonarQube Service
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000" # SonarQube UI
      - "9092:9092" # SonarQube secondary port (for internal communication)
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    networks:
      - monitoring_network
    # If you want persistent data, uncomment the volumes section below
    # volumes:
    #   - sonarqube_data:/opt/sonarqube/data
    #   - sonarqube_extensions:/opt/sonarqube/extensions
    #   - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - db # SonarQube needs its database to start

  # PostgreSQL Database for SonarQube
  db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    networks:
      - monitoring_network
    # If you want persistent data, uncomment the volumes section below
    # volumes:
    #   - db_data:/var/lib/postgresql/data

  # Prometheus Monitoring Server
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090" # Prometheus UI
    volumes:
      # Explicitly mount the prometheus.yml file directly (fixed from previous attempts)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: --config.file=/etc/prometheus/prometheus.yml # Prometheus will find prometheus.yml inside this mounted directory
    networks:
      - monitoring_network # Must be on the same network as the Spring Boot app
    depends_on:
      - sonarqube # Start Prometheus after core services (not a strict dependency, but good practice)

  # Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Grafana UI
    networks:
      - monitoring_network
    depends_on:
      - prometheus # Grafana needs Prometheus as its data source

  # Nexus Repository Manager
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    ports:
      - "8081:8081" # Nexus UI and default access port
    volumes:
      - nexus_data:/nexus-data # Persistent storage for Nexus
    networks:
      - monitoring_network # Ensure Nexus is on the same network if other services need to interact
    environment:
      # Adjust memory allocation if needed, default is often 2703M.
      # These values (256m - 768m) are good for VMs with limited RAM (e.g., 4GB).
      # Remove this line or increase values if your VM has more RAM.
      INSTALL4J_ADD_VM_PARAMS: "-Xms256m -Xmx768m"
    restart: unless-stopped # Always restart unless explicitly stopped
    healthcheck: # Added healthcheck to ensure Nexus is ready before dependent services might use it
      test: ["CMD-SHELL", "curl -f http://localhost:8081/repository/maven-public/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # Give Nexus more time to start up on first boot


# Define named volumes for persistent data
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  db_data:
  nexus_data: # <--- NEW NAMED VOLUME FOR NEXUS
    driver: local